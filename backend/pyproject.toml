[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lovemediator-backend"
version = "0.1.0"
description = "Backend service"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-multipart>=0.0.18",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "psycopg[binary]>=3.2.0",
  "bcrypt>=4.0",
  "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["app"]
package-dir = {"app" = "app"}
